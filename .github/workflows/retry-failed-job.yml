name: Retry failed audiobook job

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "Optional job ID to resume"
        required: false
        type: string
      test:
        description: "Use short test mode"
        required: false
        type: boolean
        default: false

concurrency:
  group: audiobook-channel
  cancel-in-progress: false

jobs:
  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-torch.txt
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg espeak-ng
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: kokoro-${{ runner.os }}-v1
      - run: pip install -r requirements-torch.txt -r requirements.txt
      - run: python -m compileall -q src scripts
      - name: Resume audiobook
        env:
          PYTHONPATH: ${{ github.workspace }}
          DRIVE_REQUIRE_PERSISTENCE: 'true'
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          AUDIOBOOK_DRIVE_CREDENTIALS: ${{ secrets.AUDIOBOOK_DRIVE_CREDENTIALS }}
          AUDIOBOOK_DRIVE_ROOT_FOLDER_ID: ${{ secrets.AUDIOBOOK_DRIVE_ROOT_FOLDER_ID }}
          AUDIOBOOK_VIDEO_LIBRARY_FOLDER_ID: ${{ secrets.AUDIOBOOK_VIDEO_LIBRARY_FOLDER_ID }}
          YOUTUBE_TOKEN_JSON_BOOKS: ${{ secrets.YOUTUBE_TOKEN_JSON_BOOKS }}
          YOUTUBE_VISIBILITY_BOOKS: ${{ inputs.test && 'private' || vars.YOUTUBE_VISIBILITY_BOOKS || 'private' }}
          AUDIOBOOK_TARGET_MINUTES: ${{ vars.AUDIOBOOK_TARGET_MINUTES || '30' }}
          AUDIOBOOK_TTS_PROFILE: ${{ vars.AUDIOBOOK_TTS_PROFILE || 'audiobook' }}
        run: python scripts/pipeline.py --channel audiobook ${{ inputs.test && '--test' || '' }}
